<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Building something big — Amir Nissim</title>
  <meta name="description" content="Exploring what's next.">
  <meta property="og:title" content="Building something big">
  <meta property="og:description" content="Exploring what's next.">
  <meta property="og:url" content="https://buildingsomethingbig.com">
  <meta property="og:type" content="website">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='55' width='60' height='25' fill='%23f97316'/></svg>">
  <style>
    :root {
      --bg: #0c0a09;
      --text: #fafaf9;
      --muted: #a8a29e;
      --accent: #f97316;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 60% at 50% 115%, rgba(249, 115, 22, 0.13), transparent 70%);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    main {
      max-width: 40rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      animation: rise 0.9s ease-out both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 0.09em;
      margin-left: 0.12em;
      background: var(--accent);
      vertical-align: baseline;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .nowrap {
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }

      .cursor {
        animation: none;
      }
    }

    .sub {
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      color: var(--muted);
      line-height: 1.6;
      max-width: 34rem;
    }

    .ask {
      font-size: clamp(1rem, 2.6vw, 1.1rem);
      color: var(--text);
      line-height: 1.7;
      max-width: 33rem;
    }

    .cta {
      display: inline-block;
      margin-top: 0.5rem;
      background: var(--accent);
      color: #1c1007;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.85rem 2.2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(249, 115, 22, 0.35);
    }

    footer {
      margin-top: 4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid rgba(168, 162, 158, 0.35);
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--text);
    }

    footer .sep {
      margin: 0 0.6rem;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <main>
    <h1>We're Building <span class="nowrap">something big<span class="cursor" aria-hidden="true"></span></span></h1>
    <p class="sub">Exploring what's next.</p>
    <p class="ask">Looking for a hard problem to solve over the next decade and the right partners to take it on with.
      If you're building, or you see something broken that shouldn't be — let's talk.</p>
    <a class="cta" href="https://meet.amirnissim.com">Let's talk</a>
  </main>
  <footer>
    Amir Nissim
    <span class="sep">·</span>
    <a href="https://www.linkedin.com/in/amirni/">LinkedIn</a>
    <span class="sep">·</span>
    <a href="mailto:amir@buildingsomethingbig.com">Email</a>
  </footer>
</body>

</html>
